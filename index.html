<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="相簿工房">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F2EC">
<title>相簿工房</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Shippori+Mincho:wght@500;700&family=Klee+One:wght@400;600&family=Yomogi&family=Kaisei+Decol:wght@500&family=Dela+Gothic+One&family=Hachi+Maru+Pop&family=Mochiy+Pop+One&family=DotGothic16&family=Zen+Kurenaido&family=LXGW+WenKai+TC&family=Noto+Serif+TC:wght@500&display=swap">
<style>
:root{
  --bg:#F7F2EC;--card:#FFFFFF;--ink:#2F2723;--sub:#8C8079;--line:#E9E0D6;
  --acc:#C0607E;--acc2:#F6DFE7;--danger:#C2453B;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Hiragino Sans","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --round:"Zen Maru Gothic",var(--sans);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1C1917;--card:#28231F;--ink:#F3ECE6;--sub:#A99D93;--line:#3B342E;--acc:#E58FAE;--acc2:#4A2E38;--danger:#F07B70}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
body.lock{overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
input[type=color]{padding:2px;height:40px;width:52px;border-radius:10px;flex:none}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--acc)}
input[type=checkbox]{width:auto;accent-color:var(--acc);transform:scale(1.2)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:max(10px,env(safe-area-inset-top)) 12px 8px}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:4px}
.top h1{flex:1;min-width:0;font-family:var(--round);font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.ib{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.ib:active{background:var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.block{width:100%}
.btn.danger{color:var(--danger)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row.wrap2{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--sub);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px}
.chip.on{border-color:var(--acc);background:var(--acc2)}
.hs .chip{flex:none;white-space:nowrap}
.hs{display:flex;gap:10px;overflow-x:auto;padding:3px 3px 8px;margin:0 -3px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hs::-webkit-scrollbar{display:none}
.tile{flex:none;width:74px;text-align:center;font-size:12px;line-height:1.3;color:var(--sub)}
.tile .im{width:74px;height:74px;border-radius:14px;background:var(--card);overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:5px;box-shadow:0 0 0 1px var(--line)}
.tile .im img,.tile .im canvas{width:100%;height:100%;object-fit:cover;display:block}
.tile.on .im{box-shadow:0 0 0 2.5px var(--acc)}
.tile.on{color:var(--ink);font-weight:600}
.tile.wide{width:112px}.tile.wide .im{width:112px}
.scene{flex:none;width:118px;border-radius:14px;background:var(--card);box-shadow:0 0 0 1px var(--line);padding:8px;text-align:left}
.scene.on{box-shadow:0 0 0 2.5px var(--acc)}
.scene .sw{display:flex;gap:3px;margin-bottom:6px;align-items:center}
.scene .sw i{width:15px;height:15px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.scene .sw img,.scene .sw canvas{width:26px;height:26px;margin-left:auto;border-radius:6px}
.scene b{display:block;font-size:13px}
.scene small{display:block;font-size:11px;color:var(--sub)}
.sec{margin-bottom:20px}
.sec>h3{font-size:14px;color:var(--sub);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sec>h3 .r{margin-left:auto;font-weight:400}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 0 0 1px var(--line)}
.lbl{display:block;font-size:13px;color:var(--sub);margin:10px 0 5px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* home */
.hero{padding:22px 4px 8px}
.hero h2{font-family:var(--round);font-size:24px;line-height:1.3}
.hero p{color:var(--sub);font-size:14px;margin-top:4px}
.albums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
.alb{text-align:left}
.alb .cv{aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--line);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.alb .cv img{width:100%;height:100%;object-fit:cover;display:block}
.alb b{display:block;font-size:15px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alb small{color:var(--sub);font-size:12px}
.empty{margin-top:26px;text-align:center;padding:30px 18px}
.empty .big{font-size:54px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--acc2);border-radius:14px;padding:12px 14px;font-size:13px;margin-top:14px}
.tip .x{margin-left:auto;font-size:16px;color:var(--sub);padding:0 4px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:15;box-shadow:0 6px 20px rgba(192,96,126,.35);padding:13px 24px;font-size:16px}
/* album */
.pages{display:flex;flex-direction:column;gap:26px;padding-top:16px}
.pimg{position:relative;width:100%;border-radius:4px;overflow:hidden;background:var(--line);box-shadow:0 3px 14px rgba(0,0,0,.10)}
.pimg img{width:100%;height:100%;display:block}
.pimg .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.25)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(0,0,0,.12);border-top-color:var(--acc);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pbar{display:flex;gap:6px;margin-top:8px;align-items:center}
.pbar .t{flex:1;min-width:0;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(25,18,12,.4);z-index:50;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:93vh;max-height:93dvh;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .26s ease;max-width:640px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet.show{transform:none}
.sheet.tall{height:93vh;height:93dvh}
.sh-hd{display:flex;align-items:center;gap:6px;padding:10px 10px 8px 18px;border-bottom:1px solid var(--line);flex:none}
.sh-hd h2{flex:1;font-size:17px;font-family:var(--round);font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-pv{flex:none;padding:10px 16px 6px;display:flex;justify-content:center;border-bottom:1px solid var(--line);background:var(--bg)}
.sh-pv .pvbox{position:relative;height:30vh;max-height:300px}
.sh-pv img{height:100%;width:auto;display:block;border-radius:3px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.sh-pv .ld{position:absolute;right:6px;top:6px}
.sh-pv .ld .spin{width:18px;height:18px;border-width:2px}
.sh-bd{overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(40,32,28,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:90;opacity:0;transition:all .25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.busy{position:fixed;inset:0;z-index:80;background:rgba(25,18,12,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.busy .card{width:100%;max-width:320px;text-align:center}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.pills{margin-top:8px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--acc2);margin:0 4px 4px 0}
.ph-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ph-row img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none;background:var(--line)}
.ph-row .ops{display:flex;gap:2px;flex-wrap:wrap;margin-top:4px}
.ph-row .ops button{font-size:12px;padding:3px 8px;border-radius:8px;background:var(--line)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.thumbs button{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--line);box-shadow:0 0 0 1px var(--line)}
.thumbs button.on{box-shadow:0 0 0 3px var(--acc)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.exp-img{width:100%;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.12);display:block;-webkit-touch-callout:default}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
.err{color:var(--danger);font-size:13px;margin-top:6px}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="filePick" accept="image/*" multiple style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
<input type="file" id="jsonPick" accept=".json,application/json" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
<script>
"use strict";
/* ══════════════ 相簿工房 ══════════════
   相片只存喺呢部機（IndexedDB），唔會上傳去任何 server。
   所有裝飾素材（花紋、貼紙、相框、紙膠帶、背景紙）都係用 code 即場畫，
   冇任何外部圖片；字體用 Google Fonts。 */

/* ───────── 小工具 ───────── */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){
    const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;
    else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2),v);
    else if(k==='html')e.innerHTML=v;else if(k in e&&k!=='list'&&k!=='type')e[k]=v;else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}
  return e;
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>r()));
const hx=c=>{c=String(c||'#888888').replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');return[0,2,4].map(i=>parseInt(c.slice(i,i+2),16)||0)};
const toHex=a=>'#'+a.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return toHex(A.map((v,i)=>v+(B[i]-v)*t))};
const rgba=(c,a)=>{const[r,g,b]=hx(c);return`rgba(${r},${g},${b},${a})`};
const isHex=s=>/^#[0-9a-f]{6}$/i.test(String(s||'').trim());
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]}
function hsl2rgb(h,s,l){h=((h%360)+360)%360/360;if(!s)return[l*255,l*255,l*255];const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q;const f=t=>{t=(t+1)%1;return t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p};return[f(h+1/3)*255,f(h)*255,f(h-1/3)*255]}
const hslOf=c=>rgb2hsl(...hx(c));
const fromHsl=(h,s,l)=>toHex(hsl2rgb(h,clamp(s,0,1),clamp(l,0,1)));
const lum=c=>{const[r,g,b]=hx(c).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b};
function rng(seed){let a=(seed>>>0)||1;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=s=>{let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
const newSeed=()=>(Math.random()*2**31)>>>0;
const WD='日一二三四五六';
function fmtDay(key){if(!key||key==='nodate')return'';const[y,m,d]=key.split('-');const dt=new Date(+y,m-1,+d);return`${y}.${m}.${d}（${WD[dt.getDay()]}）`}
function fmtRange(a,b){if(!a)return'';const A=a.split('-'),B=(b||a).split('-');if(a===b||!b)return`${A[0]}.${A[1]}.${A[2]}`;if(A[0]===B[0])return`${A[0]}.${A[1]}.${A[2]} – ${B[1]}.${B[2]}`;return`${A[0]}.${A[1]}.${A[2]} – ${B[0]}.${B[1]}.${B[2]}`}

/* ══════════════ 素材庫 ══════════════ */

/* 字體（全部 Google Fonts 免費） */
const FONTS={
  zenmaru:{n:'圓體',f:'Zen Maru Gothic',w:500,tw:700},
  shippori:{n:'明朝',f:'Shippori Mincho',w:500,tw:700},
  klee:{n:'鉛筆手寫',f:'Klee One',w:400,tw:600},
  yomogi:{n:'塗鴉手寫',f:'Yomogi',w:400,tw:400},
  kaisei:{n:'裝飾明朝',f:'Kaisei Decol',w:500,tw:500},
  dela:{n:'粗黑',f:'Dela Gothic One',w:400,tw:400},
  hachi:{n:'圓潤可愛',f:'Hachi Maru Pop',w:400,tw:400},
  mochiy:{n:'POP 字',f:'Mochiy Pop One',w:400,tw:400},
  dot:{n:'像素',f:'DotGothic16',w:400,tw:400},
  kurenaido:{n:'毛筆',f:'Zen Kurenaido',w:400,tw:400},
  wenkai:{n:'文楷（繁中）',f:'LXGW WenKai TC',w:400,tw:400},
  notoserif:{n:'宋體（繁中）',f:'Noto Serif TC',w:500,tw:500}
};
const FALLBACK='"PingFang HK","PingFang TC","Hiragino Sans","Noto Sans TC","Microsoft JhengHei",sans-serif';
const fontStr=(id,px,title)=>{const F=FONTS[id]||FONTS.zenmaru;return`${title?F.tw:F.w} ${Math.max(1,Math.round(px))}px "${F.f}",${FALLBACK}`};
async function loadFonts(list){
  if(!document.fonts||!document.fonts.load)return;
  const ps=list.map(([id,txt,tt])=>document.fonts.load(fontStr(id,32,tt),(txt||'')+'あ字Aa0').catch(()=>{}));
  await Promise.race([Promise.all(ps),sleep(4000)]);
}

/* 相片濾鏡（逐粒像素計，唔靠 ctx.filter，iPhone 都一樣效果） */
const FILTERS={none:{n:'原相'},film:{n:'菲林暖調'},fade:{n:'褪色'},soft:{n:'粉嫩'},vivid:{n:'鮮豔'},cool:{n:'冷調'},sepia:{n:'懷舊啡'},mono:{n:'黑白'}};
function filterPixels(d,kind){
  for(let i=0;i<d.length;i+=4){
    let r=d[i],g=d[i+1],b=d[i+2],m;
    switch(kind){
      case'film':r=r*1.05+14;g=g+6;b=b*.86+16;m=(r+g+b)/3;r=m+(r-m)*.86;g=m+(g-m)*.86;b=m+(b-m)*.86;break;
      case'fade':r=r*.8+40;g=g*.8+38;b=b*.8+44;break;
      case'soft':r=r*.88+34;g=g*.86+24;b=b*.88+30;break;
      case'vivid':m=(r+g+b)/3;r=m+(r-m)*1.35;g=m+(g-m)*1.35;b=m+(b-m)*1.35;r=(r-128)*1.07+128;g=(g-128)*1.07+128;b=(b-128)*1.07+128;break;
      case'cool':r=r*.92;g=g*.99+4;b=b*1.05+16;break;
      case'sepia':{const R=r*.393+g*.769+b*.189,G=r*.349+g*.686+b*.168,B=r*.272+g*.534+b*.131;r=r*.2+R*.8;g=g*.2+G*.8;b=b*.2+B*.8}break;
      case'mono':m=.3*r+.59*g+.11*b;r=g=b=m*1.04+5;break;
    }
    d[i]=r;d[i+1]=g;d[i+2]=b;
  }
}

/* 裝飾圖案（全部向量，以 (0,0) 為中心、大約 20×20） */
const P2=s=>new Path2D(s);
function poly(x,pts){x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath()}
function circ(x,cx,cy,r){x.beginPath();x.arc(cx,cy,r,0,Math.PI*2)}
function ell(x,cx,cy,rx,ry,rot){x.beginPath();x.ellipse(cx,cy,rx,ry,rot||0,0,Math.PI*2)}
const MAPLE=(()=>{let d='';const N=180;for(let i=0;i<=N;i++){const a=i/N*Math.PI*2;const r=5.6+4.4*Math.pow(Math.abs(Math.cos(2.5*a)),.55)+.75*Math.cos(25*a);d+=(i?'L':'M')+(r*Math.sin(a)).toFixed(2)+','+(-r*Math.cos(a)).toFixed(2)}return P2(d+'Z')})();
const MOTIFS={

/* 和柄花紋（每款係一塊可以無限重複嘅 tile） */
function tileCv(w,hh){const c=document.createElement('canvas');c.width=Math.max(2,Math.round(w));c.height=Math.max(2,Math.round(hh));return[c,c.getContext('2d')]}
const PATTERNS={
  none:{n:'無'},
  seigaiha:{n:'青海波',t(s,c,bg){const R=s,[cv,x]=tileCv(2*R,R);x.lineWidth=Math.max(1,R/12);for(let j=-2;j<=4;j++)for(let i=-1;i<=2;i++){const cx=i*2*R+(j&1?R:0),cy=j*R/2;x.fillStyle=bg;circ(x,cx,cy,R*.98);x.fill();x.strokeStyle=c;for(const k of[.95,.72,.5,.28]){circ(x,cx,cy,R*k);x.stroke()}}return cv}},
  asanoha:{n:'麻之葉',t(s,c){const a=s*2,ht=a*Math.sqrt(3)/2,[cv,x]=tileCv(a,2*ht);x.strokeStyle=c;x.lineWidth=Math.max(1,s/16);const tri=(A,B,C)=>{const g=[(A[0]+B[0]+C[0])/3,(A[1]+B[1]+C[1])/3];x.beginPath();x.moveTo(A[0],A[1]);x.lineTo(B[0],B[1]);x.lineTo(C[0],C[1]);x.closePath();for(const P of[A,B,C]){x.moveTo(g[0],g[1]);x.lineTo(P[0],P[1])}x.stroke()};for(let j=-1;j<=2;j++){const y0=j*ht,y1=y0+ht,o0=(j&1)?a/2:0,o1=((j+1)&1)?a/2:0;for(let i=-2;i<=2;i++){const tx=o0+i*a;tri([tx,y0],[tx+a,y0],[tx+a/2,y1]);const bx=o1+i*a;tri([bx,y1],[bx+a,y1],[bx+a/2,y0])}}return cv}},
  ichimatsu:{n:'市松格',t(s,c){const[cv,x]=tileCv(2*s,2*s);x.fillStyle=c;x.fillRect(0,0,s,s);x.fillRect(s,s,s,s);return cv}},
  shippo:{n:'七寶',t(s,c){const[cv,x]=tileCv(2*s,2*s);x.strokeStyle=c;x.lineWidth=Math.max(1,s/12);for(const[cx,cy]of[[0,0],[2*s,0],[0,2*s],[2*s,2*s],[s,s]]){circ(x,cx,cy,s);x.stroke()}return cv}},
  yagasuri:{n:'矢絣',t(s,c){const[cv,x]=tileCv(2*s,2*s);x.fillStyle=c;for(let k=-1;k<=1;k++){const y=k*2*s;poly(x,[[0,y],[s,y+.5*s],[s,y+1.5*s],[0,y+s]]);x.fill();poly(x,[[2*s,y+s],[s,y+1.5*s],[s,y+2.5*s],[2*s,y+2*s]]);x.fill()}return cv}},
  uroko:{n:'鱗紋',t(s,c){const th=s*.9,[cv,x]=tileCv(2*s,2*th);x.fillStyle=c;poly(x,[[0,th],[s,0],[2*s,th]]);x.fill();poly(x,[[-s,2*th],[0,th],[s,2*th]]);x.fill();poly(x,[[s,2*th],[2*s,th],[3*s,2*th]]);x.fill();return cv}},
  kikko:{n:'龜甲',t(s,c){const r3=Math.sqrt(3),[cv,x]=tileCv(3*s,r3*s);x.strokeStyle=c;x.lineWidth=Math.max(1,s/14);const hex=(cx,cy,r)=>{poly(x,[0,1,2,3,4,5].map(i=>[cx+r*Math.cos(i*Math.PI/3),cy+r*Math.sin(i*Math.PI/3)]));x.stroke()};for(const[cx,cy]of[[0,0],[3*s,0],[0,r3*s],[3*s,r3*s],[1.5*s,r3*s/2],[1.5*s,-r3*s/2],[1.5*s,1.5*r3*s]]){hex(cx,cy,s*.93);hex(cx,cy,s*.68)}return cv}},
  hishi:{n:'菱紋',t(s,c){const[cv,x]=tileCv(2*s,2*s);x.strokeStyle=c;x.fillStyle=c;x.lineWidth=Math.max(1,s/12);poly(x,[[s,0],[2*s,s],[s,2*s],[0,s]]);x.stroke();poly(x,[[s,s*.6],[s*1.4,s],[s,s*1.4],[s*.6,s]]);x.fill();return cv}},
  nami:{n:'波紋',t(s,c){const[cv,x]=tileCv(2*s,s);x.strokeStyle=c;x.lineWidth=Math.max(1,s/8);x.beginPath();x.moveTo(0,s/2);x.quadraticCurveTo(s/2,0,s,s/2);x.quadraticCurveTo(1.5*s,s,2*s,s/2);x.stroke();return cv}},
  tatewaku:{n:'立涌',t(s,c){const[cv,x]=tileCv(2*s,2*s);x.strokeStyle=c;x.lineWidth=Math.max(1,s/10);for(const side of[1,-1]){x.beginPath();for(let k=0;k<=40;k++){const y=k/40*2*s;const xx=s+side*(s*.3+s*.42*Math.sin(y/(2*s)*Math.PI*2));k?x.lineTo(xx,y):x.moveTo(xx,y)}x.stroke()}return cv}},
  polka:{n:'波點',t(s,c){const[cv,x]=tileCv(2*s,2*s);x.fillStyle=c;circ(x,s/2,s/2,s*.22);x.fill();circ(x,1.5*s,1.5*s,s*.22);x.fill();return cv}},
  gingham:{n:'格紋',t(s,c){const[cv,x]=tileCv(2*s,2*s);x.fillStyle=rgba(c,.45);x.fillRect(0,0,s,2*s);x.fillRect(0,0,2*s,s);return cv}},
  stripe:{n:'間條',t(s,c){const[cv,x]=tileCv(2*s,2*s);x.fillStyle=c;x.fillRect(0,0,s,2*s);return cv}}
};

let NOISE=null;
function noiseTile(){
  if(NOISE)return NOISE;
  const[c,x]=tileCv(160,160);const id=x.createImageData(160,160),d=id.data,r=rng(7);
  for(let i=0;i<d.length;i+=4){const v=r()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=r()*70}
  x.putImageData(id,0,0);return NOISE=c;
}
function rrect(x,X,Y,w,hh,r){
  r=Math.max(0,Math.min(r,w/2,hh/2));x.beginPath();
  x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+hh,r);x.arcTo(X+w,Y+hh,X,Y+hh,r);x.arcTo(X,Y+hh,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();
}
function shadowOn(x,th,u,k=1){x.shadowColor=th.dark?'rgba(0,0,0,.5)':'rgba(60,40,25,.22)';x.shadowBlur=u*1.4*k;x.shadowOffsetY=u*.45*k}
function shadowOff(x){x.shadowColor='transparent';x.shadowBlur=0;x.shadowOffsetY=0}
function fitText(x,t,maxW){
  t=String(t||'');if(x.measureText(t).width<=maxW)return t;
  while(t.length>1&&x.measureText(t+'…').width>maxW)t=t.slice(0,-1);return t+'…';
}
function wrapText(x,t,maxW,maxLines){
  const toks=String(t||'').replace(/\r/g,'').match(/\n|[⺀-鿿　-〿＀-￯]|[^\s⺀-鿿　-〿＀-￯]+\s*|[ \t]+/g)||[];
  const out=[];let line='';
  for(const tk of toks){
    if(tk==='\n'){out.push(line);line='';continue}
    const test=line+tk;
    if(x.measureText(test.trimEnd()).width>maxW&&line.trim()){out.push(line.trimEnd());line=tk.trimStart()}else line=test;
  }
  if(line.trim())out.push(line.trimEnd());
  if(out.length>maxLines){const k=out.slice(0,maxLines);k[maxLines-1]=fitText(x,k[maxLines-1]+'……',maxW);return k}
  return out;
}
function drawPhoto(x,img,X,Y,w,hh,filter,fy=.42){
  const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;if(!iw||!ih||w<1||hh<1)return;
  const s=Math.max(w/iw,hh/ih),sw=w/s,sh=hh/s,sx=(iw-sw)/2,sy=clamp((ih-sh)*fy,0,ih-sh);
  if(!filter||filter==='none'){x.drawImage(img,sx,sy,sw,sh,X,Y,w,hh);return}
  const W=Math.max(1,Math.round(w)),H=Math.max(1,Math.round(hh));
  const c=document.createElement('canvas');c.width=W;c.height=H;const t=c.getContext('2d',{willReadFrequently:true});
  t.drawImage(img,sx,sy,sw,sh,0,0,W,H);const id=t.getImageData(0,0,W,H);filterPixels(id.data,filter);t.putImageData(id,0,0);
  x.drawImage(c,X,Y,w,hh);c.width=c.height=0;
}

}

function drawPaper(x,th,W,H,R){
  const C=th.colors,ink=C.ink,u=W/100;
  let bg=C.bg;if(th.paper==='kraft'&&!th.dark)bg=mix(C.bg,'#C9A57A',.42);
  x.fillStyle=bg;x.fillRect(0,0,W,H);x.save();
  switch(th.paper){
    case'grid':{const s=W/22;x.strokeStyle=rgba(ink,th.dark?.13:.075);x.lineWidth=Math.max(1,u*.12);x.beginPath();for(let v=s;v<W;v+=s){x.moveTo(v,0);x.lineTo(v,H)}for(let v=s;v<H;v+=s){x.moveTo(0,v);x.lineTo(W,v)}x.stroke();break}
    case'dots':{const s=W/22;x.fillStyle=rgba(ink,th.dark?.25:.16);for(let a=s;a<W;a+=s)for(let b=s;b<H;b+=s){circ(x,a,b,Math.max(.8,u*.22));x.fill()}break}
    case'lines':{const s=W/16;x.strokeStyle=rgba(ink,th.dark?.15:.09);x.lineWidth=Math.max(1,u*.14);x.beginPath();for(let v=s*1.5;v<H;v+=s){x.moveTo(0,v);x.lineTo(W,v)}x.stroke();x.strokeStyle=rgba(C.ac,.35);x.beginPath();x.moveTo(u*4,0);x.lineTo(u*4,H);x.stroke();break}
    case'washi':{x.lineCap='round';for(let i=0;i<150;i++){const px=R()*W,py=R()*H,l=u*(1.5+R()*5),a=R()*Math.PI;x.strokeStyle=R()<.55?rgba('#ffffff',th.dark?.06:.55):rgba(ink,.05);x.lineWidth=Math.max(.6,u*(.08+R()*.18));x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px+Math.cos(a)*l*.5+R()*u,py+Math.sin(a)*l*.5,px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke()}break}
    case'kraft':{for(let i=0;i<240;i++){x.fillStyle=R()<.5?rgba('#5a3a1a',.07):rgba('#ffffff',.09);circ(x,R()*W,R()*H,Math.max(.5,u*(.1+R()*.35)));x.fill()}break}
  }
  x.globalAlpha=th.paper==='kraft'?.55:(th.dark?.2:.28);
  x.fillStyle=x.createPattern(noiseTile(),'repeat');x.fillRect(0,0,W,H);x.restore();
}
/* 和柄花紋擺位 */
function patInsets(th,W,H){
  const z={t:0,r:0,b:0,l:0};if(!PATTERNS[th.pattern]||!PATTERNS[th.pattern].t)return z;const u=W/100;
  if(th.patPos==='band')z.b=H*.085;else if(th.patPos==='border')z.t=z.r=z.b=z.l=u*3.6;else if(th.patPos==='side')z.l=u*8.5;
  return z;
}
function drawPattern(x,th,W,H){
  const P=PATTERNS[th.pattern];if(!P||!P.t||!th.patPos||th.patPos==='none')return;
  const C=th.colors,u=W/100,s=Math.max(3,u*(th.patPos==='full'?3.6:2.8)),ins=patInsets(th,W,H),k=W*.26;
  const tile=P.t(s,th.dark?mix(C.ac,C.bg,.15):C.ac,C.bg);
  x.save();x.beginPath();
  switch(th.patPos){
    case'band':x.rect(0,H-ins.b,W,ins.b);break;
    case'border':x.rect(0,0,W,H);x.rect(ins.l,ins.t,W-ins.l-ins.r,H-ins.t-ins.b);break;
    case'side':x.rect(0,0,ins.l,H);break;
    case'corner':x.moveTo(W,0);x.lineTo(W-k,0);x.lineTo(W,k);x.closePath();x.moveTo(0,H);x.lineTo(k,H);x.lineTo(0,H-k);x.closePath();break;
    default:x.rect(0,0,W,H);
  }
  x.clip(th.patPos==='border'?'evenodd':'nonzero');
  x.globalAlpha=th.patPos==='full'?(th.dark?.13:.09):(th.dark?.55:.5);
  x.fillStyle=x.createPattern(tile,'repeat');x.fillRect(0,0,W,H);x.restore();
  if(th.patPos==='full')return;
  x.save();x.strokeStyle=rgba(C.ac,.6);x.lineWidth=Math.max(1,u*.25);x.beginPath();
  switch(th.patPos){
    case'band':x.moveTo(0,H-ins.b);x.lineTo(W,H-ins.b);break;
    case'border':x.rect(ins.l,ins.t,W-ins.l-ins.r,H-ins.t-ins.b);break;
    case'side':x.moveTo(ins.l,0);x.lineTo(ins.l,H);break;
    case'corner':x.moveTo(W-k,0);x.lineTo(W,k);x.moveTo(k,H);x.lineTo(0,H-k);break;
  }
  x.stroke();x.restore();
}

function drawTape(x,th,cx,cy,len,wid,ang,col){
  x.save();x.translate(cx,cy);x.rotate(ang);
  const n=5,hw=len/2,hh=wid/2,zz=wid/n,u=wid/10;
  x.beginPath();x.moveTo(-hw,-hh);x.lineTo(hw,-hh);
  for(let i=0;i<n;i++)x.lineTo(hw-(i%2?0:zz*.4),-hh+zz*(i+.5));
  x.lineTo(hw,hh);x.lineTo(-hw,hh);
  for(let i=n-1;i>=0;i--)x.lineTo(-hw+(i%2?0:zz*.4),-hh+zz*(i+.5));
  x.closePath();x.fillStyle=rgba(col,.8);x.fill();
  x.save();x.clip();x.fillStyle='rgba(255,255,255,.42)';
  switch(th.washi){
    case'stripe':for(let k=-len-wid;k<len;k+=u*3.4){x.beginPath();x.moveTo(k,-hh);x.lineTo(k+u*1.6,-hh);x.lineTo(k+u*1.6+wid,hh);x.lineTo(k+wid,hh);x.closePath();x.fill()}break;
    case'dots':{let row=0;for(let b=-hh+u*2;b<hh;b+=u*3.2,row++)for(let a=-hw+(row%2?u*1.7:0);a<hw;a+=u*3.4){circ(x,a,b,u*.85);x.fill()}break}
    case'check':x.fillStyle='rgba(255,255,255,.3)';for(let a=-hw;a<hw;a+=u*4)x.fillRect(a,-hh,u*2,wid);for(let b=-hh;b<hh;b+=u*4)x.fillRect(-hw,b,len,u*2);break;
    case'motif':{const m=th.motifs[0]||'star';for(let a=-hw+wid*.6;a<hw;a+=wid*1.15)drawMotif(x,m,a,0,wid*.62,0,'rgba(255,255,255,.85)','rgba(255,255,255,.6)');break}
  }
  x.restore();x.restore();
}
/* 特別形狀嘅卡（郵票齒邊、車票缺口）：喺另一張 canvas 打窿再貼返上去 */
function punchedCard(w,hh,color,radius,holes){
  const[c,x]=tileCv(w,hh);rrect(x,0,0,c.width,c.height,radius||0);x.fillStyle=color;x.fill();
  x.globalCompositeOperation='destination-out';for(const[a,b,r]of holes){circ(x,a,b,r);x.fill()}return c;
}
function stampCard(w,hh,u,color){
  const r=Math.max(2,u*.7),holes=[];
  const nx=Math.max(3,Math.round(w/(r*2.7))),ny=Math.max(3,Math.round(hh/(r*2.7)));
  for(let i=0;i<nx;i++){const a=(i+.5)*w/nx;holes.push([a,0,r],[a,hh,r])}
  for(let j=0;j<ny;j++){const b=(j+.5)*hh/ny;holes.push([0,b,r],[w,b,r])}
  return punchedCard(w,hh,color,0,holes);
}
function tornPath(x,X,Y,w,hh,u,R){
  const st=Math.max(2,u*1.2),j=u*.55;x.beginPath();x.moveTo(X,Y);
  for(let a=X+st;a<X+w;a+=st)x.lineTo(a,Y+(R()-.5)*j);x.lineTo(X+w,Y);
  for(let b=Y+st;b<Y+hh;b+=st)x.lineTo(X+w+(R()-.5)*j,b);x.lineTo(X+w,Y+hh);
  for(let a=X+w-st;a>X;a-=st)x.lineTo(a,Y+hh+(R()-.5)*j);x.lineTo(X,Y+hh);
  for(let b=Y+hh-st;b>Y;b-=st)x.lineTo(X+(R()-.5)*j,b);x.closePath();
}
function inkTexture(w,hh,fn,seed){
  const[c,x]=tileCv(w,hh);fn(x);x.globalCompositeOperation='destination-out';const R=rng(seed||3);
  const n=Math.min(600,c.width*c.height/170);for(let i=0;i<n;i++){x.globalAlpha=.3+R()*.7;circ(x,R()*c.width,R()*c.height,R()*c.width*.012+.4);x.fill()}
  return c;
}

const CAP_INSIDE=['polaroid','torn','ticket'];
function frameRatio(fr,cap){return fr==='polaroid'||fr==='torn'?.8:fr==='ticket'?.76:fr==='film'?.8:cap?.88:1}
function drawFramed(x,th,img,s,cap,o){
  const u=o.u,C=th.colors,fr=th.frame,R=o.R;
  x.save();x.translate(s.cx,s.cy);x.rotate((s.rot||0)*Math.PI/180);
  const w=s.w,hh=s.h,X=-w/2,Y=-hh/2;
  const fs=Math.max(u*2.3,Math.min(u*3.1,w*.075));
  const capOut=!!cap&&!CAP_INSIDE.includes(fr),capH=capOut?fs*1.9:0,ph=hh-capH;
  const capIn=(text,cx,cy,maxW,color,align)=>{x.save();shadowOff(x);x.font=fontStr(th.capFont,fs);x.fillStyle=color;x.textAlign=align||'center';x.textBaseline='middle';x.fillText(fitText(x,text,maxW),cx,cy);x.restore()};
  let tape=null;
  switch(fr){
    case'polaroid':{const pad=Math.min(w,hh)*.05,bot=cap?Math.max(pad*3,fs*2.3):pad*2.6;shadowOn(x,th,u);x.fillStyle='#FFFEFB';x.fillRect(X,Y,w,hh);shadowOff(x);drawPhoto(x,img,X+pad,Y+pad,w-2*pad,hh-pad-bot,th.filter);if(cap)capIn(cap,0,Y+hh-bot/2,w-2*pad,'#4A4038');tape=[X,Y,w,hh];break}
    case'round':{const r=Math.min(w,ph)*.07;shadowOn(x,th,u,.7);rrect(x,X,Y,w,ph,r);x.fillStyle='#fff';x.fill();shadowOff(x);x.save();rrect(x,X,Y,w,ph,r);x.clip();drawPhoto(x,img,X,Y,w,ph,th.filter);x.restore();x.lineWidth=u*.9;x.strokeStyle=th.dark?mix(C.ac,'#000000',.15):mix(C.ac,'#ffffff',.45);rrect(x,X+u*.45,Y+u*.45,w-u*.9,ph-u*.9,r*.92);x.stroke();break}
    case'film':{const bH=Math.max(u*2.6,ph*.1);shadowOn(x,th,u,.7);x.fillStyle='#1C1917';x.fillRect(X,Y,w,ph);shadowOff(x);drawPhoto(x,img,X+u*1.1,Y+bH,w-u*2.2,ph-2*bH,th.filter);x.fillStyle='rgba(255,250,240,.88)';const hw=u*1.3,hb=bH*.4,n=Math.max(3,Math.floor((w-u*1.6)/(u*3.2)));for(let i=0;i<n;i++){const a=X+u*.8+(i+.5)*(w-u*1.6)/n-hw/2;rrect(x,a,Y+(bH-hb)/2,hw,hb,hw*.25);x.fill();rrect(x,a,Y+ph-bH+(bH-hb)/2,hw,hb,hw*.25);x.fill()}tape=[X,Y,w,ph];break}
    case'thin':{const pad=Math.min(w,ph)*.035;x.fillStyle=th.dark?'rgba(255,255,255,.06)':'rgba(255,255,255,.55)';x.fillRect(X,Y,w,ph);drawPhoto(x,img,X+pad,Y+pad,w-2*pad,ph-2*pad,th.filter);x.strokeStyle=rgba(C.ink,.55);x.lineWidth=Math.max(1,u*.22);x.strokeRect(X,Y,w,ph);tape=[X,Y,w,ph];break}
    case'stamp':{const pad=Math.min(w,ph)*.075;shadowOn(x,th,u,.6);x.drawImage(stampCard(w,ph,u,'#FFFEFB'),X,Y,w,ph);shadowOff(x);drawPhoto(x,img,X+pad,Y+pad,w-2*pad,ph-pad*2.5,th.filter);x.save();x.font=fontStr('zenmaru',pad*.62,true);x.fillStyle=C.ac;x.textBaseline='middle';const ty=Y+ph-pad*.95;x.textAlign='left';x.fillText(o.country||'TRAVEL',X+pad,ty);x.textAlign='right';x.fillText(String(o.stampNo||84),X+w-pad,ty);x.restore();tape=[X,Y,w,ph];break}
    case'ticket':{const stub=cap?Math.max(fs*2.6,hh*.17):hh*.11,pad=Math.min(w,hh)*.045,nr=Math.max(3,u*1.5);shadowOn(x,th,u,.6);x.drawImage(punchedCard(w,hh,'#FFFDF7',u*.8,[[0,hh-stub,nr],[w,hh-stub,nr]]),X,Y,w,hh);shadowOff(x);drawPhoto(x,img,X+pad,Y+pad,w-2*pad,hh-stub-pad*1.6,th.filter);x.save();x.setLineDash([u*.8,u*.7]);x.strokeStyle=rgba('#3a2e28',.35);x.lineWidth=Math.max(1,u*.2);x.beginPath();x.moveTo(X+nr*1.4,Y+hh-stub);x.lineTo(X+w-nr*1.4,Y+hh-stub);x.stroke();x.restore();if(cap)capIn(cap,X+pad+u*.4,Y+hh-stub/2,w*.66,'#4A4038','left');x.save();x.font=fontStr('dot',fs*.8);x.fillStyle=C.ac;x.textAlign='right';x.textBaseline='middle';x.fillText('No.'+String(o.no||1).padStart(3,'0'),X+w-pad,Y+hh-stub/2);x.restore();break}
    case'arch':{const arch=(ox,oy,ww,hh2)=>{const ry=Math.min(ww/2,hh2*.45);x.beginPath();x.moveTo(ox,oy+hh2);x.lineTo(ox,oy+ry);x.ellipse(ox+ww/2,oy+ry,ww/2,ry,0,Math.PI,Math.PI*2);x.lineTo(ox+ww,oy+hh2);x.closePath()};shadowOn(x,th,u,.6);arch(X,Y,w,ph);x.fillStyle='#FFFEFB';x.fill();shadowOff(x);const pd=u*.9;x.save();arch(X+pd,Y+pd,w-2*pd,ph-2*pd);x.clip();drawPhoto(x,img,X+pd,Y+pd,w-2*pd,ph-2*pd,th.filter);x.restore();x.strokeStyle=rgba(C.ac,.75);x.lineWidth=Math.max(1,u*.25);arch(X-u*.9,Y-u*.9,w+u*1.8,ph+u*1.8);x.stroke();break}
    case'torn':{const pad=Math.min(w,hh)*.05,bot=cap?Math.max(pad*2.8,fs*2.2):pad*1.6;shadowOn(x,th,u,.6);x.fillStyle='#FFFEF9';tornPath(x,X,Y,w,hh,u,R);x.fill();shadowOff(x);drawPhoto(x,img,X+pad,Y+pad,w-2*pad,hh-pad-bot,th.filter);if(cap)capIn(cap,0,Y+hh-bot/2,w-2*pad,'#4A4038');tape=[X,Y,w,hh];break}
    case'circle':{const d=Math.min(w,ph),r=d/2,cy=Y+ph/2;shadowOn(x,th,u,.6);circ(x,0,cy,r);x.fillStyle='#fff';x.fill();shadowOff(x);x.save();circ(x,0,cy,r-u*.5);x.clip();drawPhoto(x,img,-r,cy-r,d,d,th.filter,.5);x.restore();x.strokeStyle=rgba(C.ac,.75);x.lineWidth=Math.max(1,u*.35);circ(x,0,cy,r+u*.9);x.stroke();break}
    default:{shadowOn(x,th,u,.8);x.fillStyle='#fff';x.fillRect(X,Y,w,ph);shadowOff(x);drawPhoto(x,img,X,Y,w,ph,th.filter);tape=[X,Y,w,ph]}
  }
  if(capOut){
    const cy=fr==='circle'?Y+ph/2+Math.min(w,ph)/2+fs*1.15:Y+ph+capH*.55;
    x.save();x.font=fontStr(th.capFont,fs);x.fillStyle=rgba(C.ink,.9);x.textAlign=fr==='thin'?'left':'center';x.textBaseline='middle';
    x.fillText(fitText(x,cap,w),fr==='thin'?X:0,cy);x.restore();
  }
  if(tape&&th.washi&&th.washi!=='none'){
    const[bx,by,bw,bh]=tape,tw=clamp(bw*.34,u*9,u*17),tt=u*3.4,col=o.idx%2?C.ac2:C.ac;
    if(o.tapeVar===1){drawTape(x,th,bx+u*1.4,by+u*1.4,tw*.8,tt,-Math.PI/4,col);drawTape(x,th,bx+bw-u*1.4,by+bh-u*1.4,tw*.8,tt,-Math.PI/4,col)}
    else if(o.tapeVar===2)drawTape(x,th,bx+bw-u*1.2,by+u*1.2,tw*.8,tt,Math.PI/4,col);
    else drawTape(x,th,0,by+u*.3,tw,tt,(R()-.5)*.16,col);
  }
  x.restore();
}

function drawSticker(x,th,id,cx,cy,S,rot,info){
  const C=th.colors;x.save();x.translate(cx,cy);x.rotate(rot||0);
  switch(id){
    case'hanko':{const off=inkTexture(S,S,c=>{rrect(c,S*.06,S*.06,S*.88,S*.88,S*.14);c.fillStyle=C.ac;c.fill();c.strokeStyle='#fff';c.lineWidth=S*.035;rrect(c,S*.15,S*.15,S*.7,S*.7,S*.08);c.stroke();c.font=fontStr('kurenaido',S*.5);c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.fillText(th.ch||'旅',S/2,S*.53)},hash(th.ch));x.globalAlpha=.92;x.drawImage(off,-S/2,-S/2);break}
    case'postmark':{const r=S*.37,col=th.dark?rgba(C.ink,.75):rgba(C.ink,.6);const off=inkTexture(S*1.9,S,c=>{c.strokeStyle=c.fillStyle=col;c.lineWidth=S*.025;circ(c,S*.5,S*.5,r);c.stroke();circ(c,S*.5,S*.5,r*.8);c.stroke();c.textAlign='center';c.textBaseline='middle';c.font=fontStr('zenmaru',S*.095,true);c.fillText(info.country||'TRAVEL',S*.5,S*.34);c.font=fontStr('dot',S*.11);c.fillText(info.dateShort||'',S*.5,S*.5);c.font=fontStr('zenmaru',S*.085,true);c.fillText(fitText(c,info.place||'旅の記録',r*1.35),S*.5,S*.66);c.lineWidth=S*.03;for(let k=0;k<4;k++){c.beginPath();const yy=S*.32+k*S*.12;for(let t=0;t<=20;t++){const xx=S*.92+t*S*.045,y2=yy+Math.sin(t*.9)*S*.03;t?c.lineTo(xx,y2):c.moveTo(xx,y2)}c.stroke()}},11);x.drawImage(off,-S*.5,-S/2);break}
    case'date':{const w=S*1.3,hb=S*.42;const off=inkTexture(w,hb,c=>{c.strokeStyle=c.fillStyle=C.ac;c.lineWidth=S*.03;rrect(c,S*.03,S*.03,w-S*.06,hb-S*.06,hb*.3);c.stroke();c.font=fontStr('dot',hb*.42);c.textAlign='center';c.textBaseline='middle';c.fillText(info.dateDots||'MEMORIES',w/2,hb/2+1)},5);x.globalAlpha=.9;x.drawImage(off,-w/2,-hb/2);break}
    case'ticket':{const w=S*1.3,hb=S*.62,col=mix(C.ac2,'#ffffff',th.dark?.15:.55);shadowOn(x,th,S/14,.5);x.drawImage(punchedCard(w,hb,col,S*.04,[[w*.28,0,S*.05],[w*.28,hb,S*.05]]),-w/2,-hb/2);shadowOff(x);const tc=lum(col)>.45?mix(C.ac2,'#000000',.6):'#ffffff';x.fillStyle=tc;x.textAlign='left';x.textBaseline='middle';x.font=fontStr('dela',hb*.15);x.fillText('TICKET',-w/2+w*.33,-hb*.24);x.font=fontStr(th.capFont,hb*.19);x.fillText(fitText(x,info.place||'旅の記録',w*.6),-w/2+w*.33,hb*.04);x.font=fontStr('dot',hb*.13);x.fillText('No.'+String(info.no||1).padStart(4,'0'),-w/2+w*.33,hb*.3);x.setLineDash([S*.03,S*.03]);x.strokeStyle=rgba('#000000',.25);x.lineWidth=S*.012;x.beginPath();x.moveTo(-w/2+w*.28,-hb*.4);x.lineTo(-w/2+w*.28,hb*.4);x.stroke();x.setLineDash([]);drawMotif(x,th.motifs[0]||'star',-w/2+w*.14,0,hb*.42,0,C.ac,C.ac2);break}
    case'label':{const w=S*1.15,hb=S*.5;shadowOn(x,th,S/14,.5);x.beginPath();x.moveTo(-w/2,0);x.lineTo(-w/2+hb*.45,-hb/2);x.lineTo(w/2,-hb/2);x.lineTo(w/2,hb/2);x.lineTo(-w/2+hb*.45,hb/2);x.closePath();x.fillStyle=C.ac;x.fill();shadowOff(x);x.fillStyle=C.bg;circ(x,-w/2+hb*.42,0,hb*.1);x.fill();x.strokeStyle=rgba(C.ink,.5);x.lineWidth=S*.012;x.beginPath();x.moveTo(-w/2+hb*.42,0);x.bezierCurveTo(-w/2-S*.1,-S*.05,-w/2-S*.15,S*.2,-w/2-S*.3,S*.12);x.stroke();x.fillStyle=lum(C.ac)>.55?C.ink:'#ffffff';x.font=fontStr('mochiy',hb*.36);x.textAlign='center';x.textBaseline='middle';x.fillText(fitText(x,info.dayLabel||'MEMORY',w*.7),hb*.22,hb*.03);break}
    case'airmail':{const w=S*1.3,hb=S*.7,b=S*.07;x.save();shadowOn(x,th,S/14,.4);x.fillStyle='#fff';x.fillRect(-w/2,-hb/2,w,hb);shadowOff(x);x.beginPath();x.rect(-w/2,-hb/2,w,hb);x.rect(-w/2+b,-hb/2+b,w-2*b,hb-2*b);x.clip('evenodd');let i=0;for(let k=-w-hb*2;k<w;k+=b*1.6,i++){x.fillStyle=i%2?'#D9483B':'#2E5AA8';x.beginPath();x.moveTo(k,-hb);x.lineTo(k+b*.8,-hb);x.lineTo(k+b*.8+hb*2,hb);x.lineTo(k+hb*2,hb);x.closePath();x.fill()}x.restore();x.fillStyle='#2E5AA8';x.textAlign='center';x.textBaseline='middle';x.font=fontStr('dela',hb*.2);x.fillText('AIR MAIL',0,-hb*.08);x.font=fontStr('klee',hb*.14);x.fillText('par avion',0,hb*.18);break}
    case'heart':case'starbadge':{const r=S*.3;shadowOn(x,th,S/14,.5);circ(x,0,0,r);x.fillStyle='#fff';x.fill();shadowOff(x);x.strokeStyle=rgba(C.ac,.55);x.lineWidth=S*.015;x.setLineDash([S*.03,S*.025]);circ(x,0,0,r*.84);x.stroke();x.setLineDash([]);drawMotif(x,id==='heart'?'heart':'star',0,r*.03,r*1.05,0,C.ac,C.ac2);break}
  }
  x.restore();
}

const PERMS={1:[[0]],2:[[0,1],[1,0]],3:[],4:[]};
(function(){for(const n of[3,4]){const out=[],go=(a,rest)=>{if(!rest.length)return out.push(a);rest.forEach((v,i)=>go([...a,v],rest.filter((_,j)=>j!==i)))};go([],[...Array(n).keys()]);PERMS[n]=out}})();
function allTemplates(n){n=clamp(n,1,4);const out=[];for(const st of['scatter','neat','mag'])LAYOUTS[st][n].forEach(t=>out.push({st,T:Array.isArray(t)?{s:t}:t}));return out}
function chooseLayout(page,th,aspects,area){
  const n=aspects.length,all=allTemplates(n);
  let cand=page.lay>=0?[all[page.lay%all.length]]:all.filter(a=>a.st===th.layout);if(!cand.length)cand=all;
  const perms=page.fixed?[[...Array(n).keys()]]:PERMS[n],fk=frameRatio(th.frame,th.caps);
  let best=null;
  for(const c of cand)for(const p of perms){let sc=0;c.T.s.forEach((sl,i)=>{const sa=(sl[2]*area.w)/(sl[3]*area.h*fk);sc+=Math.abs(Math.log(sa/aspects[p[i]]))});if(!best||sc<best.sc-1e-9)best={c,p,sc}}
  best.idx=all.indexOf(best.c);return best;
}
/* 頁面資料（標題、日期、地點…） */
function dayNumbers(album){const m={};let n=0;for(const p of album.pages)if(p.kind==='photo'&&p.day&&p.day!=='nodate'&&!(p.day in m))m[p.day]=++n;return m}
function pagePlace(album,page){
  if(page.place!=null&&page.place!=='')return page.place;
  for(const id of page.photoIds){const mt=album.photos[id];if(mt&&mt.lat!=null){const pl=nearestPlace(mt.lat,mt.lon);if(pl)return pl.n}}
  return'';
}
function albumCountry(album){
  const cnt={};for(const id in album.photos){const mt=album.photos[id];if(mt.lat!=null){const pl=nearestPlace(mt.lat,mt.lon);if(pl)cnt[pl.c]=(cnt[pl.c]||0)+1}}

/* ══════════════ 自動分頁（按拍攝日期分日） ══════════════ */
const dayKeyOf=mt=>mt&&mt.date?mt.date.slice(0,10):'nodate';
function splitBalanced(arr,max){const k=Math.ceil(arr.length/max),out=[];let i=0;for(let p=0;p<k;p++){const n=Math.floor(arr.length/k)+(p<arr.length%k?1:0);out.push(arr.slice(i,i+n));i+=n}return out}
function newPage(day,ids){return{id:uid(),kind:'photo',day,photoIds:ids,title:null,sub:null,place:null,note:'',seed:newSeed(),lay:-1,fixed:false,v:0}}
function sortPages(album){
  const cover=album.pages.filter(p=>p.kind==='cover'),rest=album.pages.filter(p=>p.kind!=='cover');
  const key=p=>p.day&&p.day!=='nodate'?p.day:'9999';
  rest.sort((a,b)=>key(a)<key(b)?-1:key(a)>key(b)?1:0);album.pages=[...cover,...rest];
}
function addPhotosToPages(album,metas){
  metas.forEach(mt=>{album.photos[mt.id]=mt});
  const sorted=metas.slice().sort((a,b)=>{const A=a.date||'9999',B=b.date||'9999';return A<B?-1:A>B?1:0});
  const groups=new Map();for(const mt of sorted){const k=dayKeyOf(mt);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(mt.id)}
  const per=clamp(album.perPage||3,1,4);
  for(const[k,ids]of groups){
    let rest=ids;const same=album.pages.filter(p=>p.kind==='photo'&&p.day===k),last=same[same.length-1];
    if(last&&last.photoIds.length<per){const room=per-last.photoIds.length;last.photoIds.push(...rest.slice(0,room));rest=rest.slice(room);last.v=(last.v||0)+1}
    if(rest.length)for(const chunk of splitBalanced(rest,per))album.pages.push(newPage(k,chunk));
  }
  sortPages(album);
  if(!album.pages.some(p=>p.kind==='cover')){
    const first=sorted.find(m=>m.w>=m.h)||sorted[0];
    album.pages.unshift({id:uid(),kind:'cover',photoIds:first?[first.id]:[],title:null,sub:null,note:'',seed:newSeed(),lay:-1,v:0});
  }
}
function repaginate(album){
  const cover=album.pages.find(p=>p.kind==='cover');

}
function usedPhotoIds(album){const s=new Set();album.pages.forEach(p=>p.photoIds.forEach(id=>s.add(id)));return s}

function paletteFromAccent(ac,dark,ac2){

  if(dark)return{bg:fromHsl(hh,clamp(s*.45,.15,.5),.11),ac,ac2:a2,ink:fromHsl(hh,.25,.93)};
  return{bg:fromHsl(hh,clamp(s*.55,.15,.6),.955),ac,ac2:a2,ink:fromHsl(hh,clamp(s*.5,.15,.5),.2)};
}
const desat=(c,k)=>{const[hh,s,l]=hslOf(c);return fromHsl(hh,s*k,l)};
function fixContrast(th){

  if(ratio<4.5){const[hh]=hslOf(C.ac);C.ink=lb>.4?fromHsl(hh,.3,.18):fromHsl(hh,.2,.93)}

function parseRequest(text,base){

  let best=null,bs=0;
  for(const id in SCENES){let s=0;for(const w of SCENES[id].kw)if(q.includes(w))s+=w.length;if(s>bs){bs=s;best=id}}
  if(best)for(const w of SCENES[best].kw)if(q.includes(w)&&!SCENES[best].kw.some(o=>o!==w&&o.includes(w)&&q.includes(o)))hits.push(w);
  const th=best?sceneRecipe(best):JSON.parse(JSON.stringify(base||sceneRecipe('sakura')));
  if(best&&base)th.caps=base.caps;
  th.request=raw;
  let rest=q;for(const id in SCENES)for(const w of SCENES[id].kw)rest=rest.split(w).join(' ');
  let denAdd=0;
  for(const st of STYLES){const m=st.kw.filter(w=>q.includes(w));if(m.length){hits.push(...m);Object.assign(th,JSON.parse(JSON.stringify(st.set)));if(st.den)denAdd+=st.den;if(st.denSet!=null)th.density=st.denSet}}
  th.density=clamp(th.density+denAdd,0,100);

  if(mm.length)th.motifs=[...new Set([...mm,...th.motifs])].slice(0,3);
  for(const w in PATTERN_WORDS)if(q.includes(w)){th.pattern=PATTERN_WORDS[w];if(!th.patPos||th.patPos==='none')th.patPos='band';hits.push(w)}
  for(const w in FRAME_WORDS)if(q.includes(w)){th.frame=FRAME_WORDS[w];hits.push(w)}
  for(const w in FONT_WORDS)if(q.includes(w)){th.titleFont=FONT_WORDS[w];hits.push(w)}
  for(const w in FILTER_WORDS)if(q.includes(w)){th.filter=FILTER_WORDS[w];hits.push(w)}
  for(const w in MOTIF_WORDS)rest=rest.split(w).join(' ');
  const wantDark=/黑|深色|暗|夜/.test(rest),wantLight=/白色|淺|淡|粉嫩|明亮/.test(rest);
  const cols=[];for(const[w,c]of COLOR_WORDS)if(rest.includes(w)){cols.push(c);hits.push(w);rest=rest.split(w).join(' ')}
  if(cols.length){th.colors=paletteFromAccent(cols[0],th.dark&&!wantLight,cols[1]);th.photoColors=false}
  if(wantDark&&!th.dark){th.dark=true;const[hh,s]=hslOf(th.colors.ac);th.colors.bg=fromHsl(hh,clamp(s*.45,.15,.5),.11);th.colors.ink=fromHsl(hh,.2,.93);hits.push('深色')}

function extractPalette(imgs){
  const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d',{willReadFrequently:true});
  const bins={},A=[0,0,0];let n=0;
  for(const im of imgs){
    try{x.clearRect(0,0,48,48);x.drawImage(im,0,0,48,48);const d=x.getImageData(0,0,48,48).data;
      for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];A[0]+=r;A[1]+=g;A[2]+=b;n++;const[hh,s,l]=rgb2hsl(r,g,b);if(s<.25||l<.18||l>.85)continue;const k=Math.floor(hh/20)%18;const o=bins[k]||(bins[k]={w:0,n:0,c:[0,0,0],h:k});o.w+=s*(1-Math.abs(l-.5));o.n++;o.c[0]+=r;o.c[1]+=g;o.c[2]+=b}

  const sorted=Object.values(bins).sort((a,b)=>b.w-a.w),avg=toHex(A.map(v=>v/n)),[ha,sa]=hslOf(avg);
  if(!sorted.length)return paletteFromAccent(fromHsl(ha,.35,.45),false);

  const[h1,s1,l1]=hslOf(toHex(top.c.map(v=>v/top.n)));

}

function setupIO(){

const sigOf=pg=>S.album._tv+':'+(pg.v||0)+':'+S.album.size;
function queueCard(c){if(c._sig===sigOf(c._pg))return;if(!rq.list.includes(c))rq.list.push(c);c._ld.style.display='';pump()}
async function pump(){
  if(rq.busy)return;rq.busy=true;
  try{
    while(rq.list.length){
      rq.list.sort((a,b)=>(b._vis?1:0)-(a._vis?1:0));
      const c=rq.list.shift();if(!c.isConnected||!S.album)continue;
      const s=sigOf(c._pg);if(c._sig===s){c._ld.style.display='none';continue}
      try{const cv=await renderPage(S.album,c._pg,PREVIEW_W);const url=await canvasURL(cv,.9);if(c._url)URL.revokeObjectURL(c._url);c._url=url;c._img.src=url;c._sig=s}catch(e){console.error(e)}
      c._ld.style.display=c._sig===sigOf(c._pg)?'none':'';
    }
  }finally{rq.busy=false}
}

    body.append(h('label',{class:'lbl'},'封面相（撳一張）'),grid);
  }else{
    body.append(...field('標題（留空＝自動）',pg.title,auto.title,v=>{pg.title=v===''?null:v;changed()}),
      ...field('地點（留空＝由 GPS 估）',pg.place,auto.place||'例如：京都・清水寺',v=>{pg.place=v===''?null:v;changed()}),
      ...field('副標題（留空＝自動：日期＋地點）',pg.sub,auto.sub||'',v=>{pg.sub=v===''?null:v;changed()}),
      ...field('一句日記（可以留空）',pg.note,'例如：第一次食到咁好食嘅抹茶雪糕！',v=>{pg.note=v;changed()},true));
    const rows=h('div');
    const photoPages=()=>a.pages.filter(p=>p.kind==='photo');
    const neighbor=d=>{const pp=photoPages(),i=pp.indexOf(pg);return pp[i+d]||null};
    const afterEmpty=()=>{if(!pg.photoIds.length){a.pages=a.pages.filter(p=>p!==pg);structural=true;sh.close();return true}return false};
    const renderRows=()=>{
      rows.innerHTML='';
      pg.photoIds.forEach((id,i)=>{
        const mt=a.photos[id];if(!mt)return;const im=h('img',{alt:''});thumbURL(id).then(u=>{im.src=u});
        const cap=h('input',{placeholder:'相片說明（例如：清水寺）',style:'padding:7px 10px;font-size:15px'});cap.value=mt.cap||'';
        cap.addEventListener('input',()=>{mt.cap=cap.value;changed()});
        const swap=j=>{const ar=pg.photoIds;[ar[i],ar[j]]=[ar[j],ar[i]];pg.fixed=true;changed();renderRows()};
        const move=d=>{const t=neighbor(d);if(!t)return;if(t.photoIds.length>=4){toast('嗰頁滿咗（每頁最多 4 張）');return}pg.photoIds.splice(i,1);d<0?t.photoIds.push(id):t.photoIds.unshift(id);t.v=(t.v||0)+1;structural=true;toast(d<0?'搬咗去上一頁':'搬咗去下一頁');if(afterEmpty())return;changed();renderRows()};
        const del=async()=>{if(!await confirmBox('移除呢張相？','會由呢本相簿移除（你手機「相片」入面嘅原相唔受影響）。','移除',true))return;pg.photoIds.splice(i,1);structural=true;if(afterEmpty())return;changed();renderRows()};
        rows.append(h('div',{class:'ph-row'},im,h('div',{class:'grow'},cap,h('div',{class:'ops'},
          i>0?h('button',{onclick:()=>swap(i-1)},'◀ 前'):null,
          i<pg.photoIds.length-1?h('button',{onclick:()=>swap(i+1)},'後 ▶'):null,
          neighbor(-1)?h('button',{onclick:()=>move(-1)},'⤴ 上一頁'):null,
          neighbor(1)?h('button',{onclick:()=>move(1)},'⤵ 下一頁'):null,
          h('button',{onclick:del},'🗑 移除')))));
      });
    };
    renderRows();
    body.append(h('label',{class:'lbl'},'相片（說明文字會顯示喺相下面）'),rows,
      h('div',{class:'row wrap2',style:'margin-top:14px'},
        h('button',{class:'btn sm',onclick:()=>{const all=allTemplates(Math.max(1,pg.photoIds.length)),cur=pg.lay>=0?pg.lay:(pg._layIdx!=null?pg._layIdx:-1);pg.lay=(cur+1)%all.length;changed();toast(`排版 ${pg.lay+1}／${all.length}`)}},'🔀 換排版'),
        h('button',{class:'btn sm',onclick:()=>{pg.seed=newSeed();changed()}},'✨ 換裝飾位置'),
        h('button',{class:'btn sm',onclick:()=>{pg.lay=-1;pg.fixed=false;changed();toast('交返俾自動排版')}},'🪄 自動排版')),
      h('button',{class:'btn block danger',style:'margin-top:18px',onclick:async()=>{if(!await confirmBox('刪除呢一頁？',`呢頁 ${pg.photoIds.length} 張相會由相簿移除。`,'刪除',true))return;a.pages=a.pages.filter(p=>p!==pg);structural=true;sh.close()}},'🗑 刪除呢一頁'));
  }
  sh=openSheet(isCover?'✏️ 編輯封面':'✏️ 編輯呢頁',body,{tall:true,preview:pv.el,actions:[h('button',{class:'btn pri sm',onclick:()=>sh.close(true)},'完成')],onClose:async()=>{
    pv.dispose();
    if(structural){await dropOrphans(a);await saveAlbum(true);renderAlbumView()}
    else{await saveAlbum(true);const c=cardOf(pg);if(c){c._lbl.textContent=pageLabel(pg);queueCard(c)}if(isCover)$$('.pcard').forEach(c=>{c._lbl.textContent=pageLabel(c._pg)})}
  }});
}

/* ───────── 匯出／備份 ───────── */
function exportSheet(){
  const a=S.album;let res=1080;const out=h('div');
  const allBtn=h('button',{class:'btn pri block',onclick:async()=>{
    allBtn.disabled=true;const b=busy('砌緊每一頁…'),files=[];
    try{for(let i=0;i<a.pages.length;i++){b.set(i/a.pages.length,`${i+1} / ${a.pages.length}`);files.push(await canvasFile(await renderPage(a,a.pages[i],res),fileName(a,i)))}}
    catch(e){toast('出錯：'+e.message,3500)}
    b.close();allBtn.disabled=false;out.innerHTML='';if(!files.length)return;
    out.append(h('p',{class:'hint',style:'font-size:14px'},`✅ 砌好 ${files.length} 頁。撳下面個掣，喺分享選單揀「儲存 ${Math.min(10,files.length)} 張影像」就會入晒「相片」App。`));
    for(let i=0;i<files.length;i+=10){const part=files.slice(i,i+10);out.append(h('button',{class:'btn block',style:'margin-top:8px',onclick:()=>shareOrDownload(part)},`📤 儲存／分享 第 ${i+1}–${i+part.length} 頁`))}
  }},'📚 匯出全部頁面（JPG）');
  openSheet('⬇︎ 匯出',h('div',null,
    sec('解像度','',seg([[1080,'標準 1080px'],[2048,'高清 2048px']],res,v=>{res=+v})),
    allBtn,out,
    h('p',{class:'hint'},'每一頁都係一張圖，可以直接放 IG、WhatsApp，或者拎去沖印。想淨係要一頁，可以撳該頁下面嘅 ⬇︎。'),
    h('div',{style:'height:14px'}),
    sec('備份','',h('button',{class:'btn block',onclick:()=>backupAlbum(a)},'💾 備份呢本相簿（.json，可以喺第二部機匯入）'))));
}
async function exportOne(pg){
  const a=S.album,b=busy('砌緊呢頁…');let file;
  try{file=await canvasFile(await renderPage(a,pg,1080),fileName(a,a.pages.indexOf(pg)))}catch(e){b.close();toast('出錯：'+e.message);return}
  b.close();const url=URL.createObjectURL(file);
  openSheet('儲存呢頁',h('div',null,h('img',{class:'exp-img',src:url,alt:''}),
    h('p',{class:'hint',style:'text-align:center'},'📱 iPhone：長按上面張圖 →「加至相片」'),
    h('div',{class:'row',style:'margin-top:12px'},h('button',{class:'btn pri grow',onclick:()=>shareOrDownload([file])},'📤 分享／儲存'),h('button',{class:'btn grow',onclick:()=>downloadFiles([file])},'⬇︎ 下載'))),
    {onClose:()=>setTimeout(()=>URL.revokeObjectURL(url),1500)});
}
async function backupAlbum(a){
  const b=busy('整理緊備份…');
  try{
    const parts=['{"app":"albumKobo","v":1,"album":',JSON.stringify(cleanAlbum(a)),',"photos":{'],ids=Object.keys(a.photos);let first=true;
    for(let i=0;i<ids.length;i++){
      b.set(i/ids.length,`${i+1} / ${ids.length}`);const rec=await dbGet('photos',ids[i]);if(!rec)continue;
      const full=(await bufToDataURL(rec.buf)).split(',')[1],tb=rec.tb?(await bufToDataURL(rec.tb)).split(',')[1]:'';
      parts.push((first?'':',')+JSON.stringify(ids[i])+':{"buf":"'+full+'","tb":"'+tb+'"}');first=false;
    }
    parts.push('}}');
    const d=new Date(),stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    const file=new File([new Blob(parts,{type:'application/json'})],`相簿備份-${safeName(a.title)}-${stamp}.json`,{type:'application/json'});
    b.close();await shareOrDownload([file]);
  }catch(e){b.close();toast('備份失敗：'+e.message,3500)}
}
function b64ToBuf(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
function importBackupPick(){
  const inp=$('#jsonPick');inp.value='';
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;const b=busy('匯入緊…');
    try{
      const j=JSON.parse(await f.text());if(j.app!=='albumKobo'||!j.album)throw new Error('唔係相簿工房嘅備份檔');
      const map={},ids=Object.keys(j.photos||{});
      for(let i=0;i<ids.length;i++){b.set(i/ids.length,`${i+1} / ${ids.length}`);const p=j.photos[ids[i]],nid=uid();await dbPut('photos',{id:nid,buf:b64ToBuf(p.buf),tb:p.tb?b64ToBuf(p.tb):null});map[ids[i]]=nid}
      const al=normalizeAlbum(j.album),ph={};al.id=uid();
      for(const k in al.photos)if(map[k])ph[map[k]]=Object.assign({},al.photos[k],{id:map[k]});
      al.photos=ph;al.pages.forEach(p=>{p.id=uid();p.photoIds=(p.photoIds||[]).map(id=>map[id]).filter(Boolean)});
      al.pages=al.pages.filter(p=>p.kind==='cover'||p.photoIds.length);al.updated=Date.now();
      await dbPut('albums',cleanAlbum(al));b.close();toast('匯入咗「'+al.title+'」',2600);
      if(location.hash&&location.hash!=='#')location.hash='';else showHome();
    }catch(e){b.close();toast('匯入失敗：'+e.message,3500)}
  };
  inp.click();
}

function makeTouchIcon(){
  try{
    const[c,x]=tileCv(180,180);x.fillStyle='#F6DFE7';x.fillRect(0,0,180,180);
    x.save();x.translate(90,96);x.rotate(-.08);x.shadowColor='rgba(0,0,0,.18)';x.shadowBlur=10;x.shadowOffsetY=3;x.fillStyle='#fff';x.fillRect(-52,-60,104,124);x.shadowColor='transparent';x.drawImage(sampleImg(),40,20,220,180,-44,-52,88,88);x.restore();
    drawTape(x,{washi:'stripe',motifs:[]},90,38,64,18,-.12,'#C0607E');drawMotif(x,'sakura',142,148,36,.3,'#E48FA9','#C9667F');
    document.head.append(h('link',{rel:'apple-touch-icon',href:c.toDataURL('image/png')}));
  }catch(e){}
}
makeTouchIcon();
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

route();
